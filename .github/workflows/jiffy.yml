name: Jiffy Dispatch

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@jiffy')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@jiffy'))
    steps:
      - name: Collect full issue thread
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          BODY=$(gh api repos/${{ github.repository }}/issues/$ISSUE_NUMBER --jq '.body // ""')
          COMMENTS=$(gh api repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments --paginate --jq '.[].body' | tr '\n' ' ')
          printf '%s' "$BODY --- $COMMENTS" > /tmp/issue_text.txt

      - name: Send to Jiffy Gateway
        env:
          JIFFY_URL: ${{ secrets.JIFFY_GATEWAY_URL }}
          JIFFY_INGEST_TOKEN: ${{ secrets.JIFFY_GITHUB_INGEST_TOKEN }}
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          REPO_URL="https://github.com/${{ github.repository }}.git"
          CALLBACK_URL="https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments"

          PAYLOAD=$(jq -n \
            --arg repo_url "$REPO_URL" \
            --arg repo_token "$REPO_TOKEN" \
            --arg username "${{ github.actor }}" \
            --rawfile issue_text /tmp/issue_text.txt \
            --arg issue_id "$ISSUE_NUMBER" \
            --arg callback_url "$CALLBACK_URL" \
            --arg callback_secret "$(echo -n "$REPO_TOKEN" | sha256sum | cut -d' ' -f1)" \
            '{
              repo: {url:$repo_url, token:$repo_token, username:$username},
              issue: {text:$issue_text, external_issue_id:$issue_id},
              callback: {url:$callback_url, secret:$callback_secret}
            }')

          HTTP_CODE=$(curl -s -o /tmp/jiffy_response -w "%{http_code}" -X POST "$JIFFY_URL/api/github/ingestion" \
            -H "Content-Type: application/json" \
            -H "X-Jiffy-Token: $JIFFY_INGEST_TOKEN" \
            -d "$PAYLOAD")

          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/jiffy_response
          echo ""

          if [ "$HTTP_CODE" -ge 400 ]; then
            exit 1
          fi
