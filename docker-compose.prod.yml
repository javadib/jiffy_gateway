services:
  web:
    image: ${DOCKER_IMAGE:-ghcr.io/${GITHUB_REPOSITORY:-jiffy}}:${IMAGE_TAG:-latest}
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery:
    image: ${DOCKER_IMAGE:-ghcr.io/${GITHUB_REPOSITORY:-jiffy}}:${IMAGE_TAG:-latest}
    command: celery -A config worker -Q execute --concurrency=3 -l info -n execute@%h
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
